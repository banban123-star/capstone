<div id="m-home" class="view-section pb-8">

    <!-- Hero -->
    <div id="m-hero" class="relative px-5 pt-5 pb-16 text-white rounded-b-[2rem] bg-gradient-to-br from-purple-600 to-indigo-700 overflow-hidden">
        <i class="ph-fill ph-motorcycle absolute -right-4 -bottom-4 text-[7rem] text-white/10 rotate-[-8deg] pointer-events-none"></i>
        <div class="flex items-start justify-between relative">
            <div class="min-w-0">
                <p id="m-greeting" class="text-xs font-semibold text-white/70">Good day,</p>
                <h2 id="m-name" class="text-2xl font-extrabold leading-tight truncate">Mechanic</h2>
                <p id="m-date" class="text-xs font-medium text-white/70 mt-1"></p>
            </div>
            <button onclick="mToast('No new notifications')" class="relative w-10 h-10 rounded-full bg-white/15 flex items-center justify-center active:scale-90 transition-transform shrink-0">
                <i class="ph-bold ph-bell text-lg"></i>
                <span class="absolute top-2.5 right-2.5 w-2 h-2 bg-red-400 rounded-full ring-2 ring-white/20"></span>
            </button>
        </div>
        <div class="flex items-center gap-2 mt-4 relative">
            <span class="inline-flex items-center gap-1.5 bg-white/15 px-2.5 py-1 rounded-full text-[11px] font-bold">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-300 animate-pulse"></span> Synced
            </span>
            <span id="m-role-chip" class="inline-flex items-center gap-1.5 bg-white/15 px-2.5 py-1 rounded-full text-[11px] font-bold"></span>
        </div>
    </div>

    <!-- Floating stat card -->
    <div class="mx-4 -mt-10 bg-white rounded-2xl shadow-lg shadow-slate-900/10 border border-slate-100 grid grid-cols-3 divide-x divide-slate-100 relative">
        <div class="py-4 text-center">
            <p id="m-stat-active" class="text-2xl font-extrabold text-slate-800 leading-none">0</p>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mt-1.5">Active Jobs</p>
        </div>
        <div class="py-4 text-center">
            <p id="m-stat-waiting" class="text-2xl font-extrabold text-orange-500 leading-none">0</p>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mt-1.5">Waiting Parts</p>
        </div>
        <div class="py-4 text-center">
            <p id="m-stat-done" class="text-2xl font-extrabold text-emerald-500 leading-none">3</p>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mt-1.5">Done Today</p>
        </div>
    </div>

    <!-- Quick actions -->
    <div class="px-4 mt-6">
        <div class="grid grid-cols-4 gap-3">
            <button onclick="mNav('diagnostics')" class="flex flex-col items-center gap-1.5 active:scale-90 transition-transform">
                <span class="w-14 h-14 rounded-2xl bg-purple-100 text-purple-600 flex items-center justify-center text-2xl"><i class="ph-fill ph-cpu"></i></span>
                <span class="text-[11px] font-bold text-slate-600">Scan</span>
            </button>
            <button onclick="mNav('repairs')" class="flex flex-col items-center gap-1.5 active:scale-90 transition-transform">
                <span class="w-14 h-14 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center text-2xl"><i class="ph-fill ph-wrench"></i></span>
                <span class="text-[11px] font-bold text-slate-600">Jobs</span>
            </button>
            <button onclick="mNav('inventory')" class="flex flex-col items-center gap-1.5 active:scale-90 transition-transform">
                <span class="w-14 h-14 rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center text-2xl"><i class="ph-fill ph-package"></i></span>
                <span class="text-[11px] font-bold text-slate-600">Parts</span>
            </button>
            <button data-mroles="chief" onclick="mNav('history')" class="flex flex-col items-center gap-1.5 active:scale-90 transition-transform">
                <span class="w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl"><i class="ph-fill ph-clock-counter-clockwise"></i></span>
                <span class="text-[11px] font-bold text-slate-600">History</span>
            </button>
            <button data-mroles="sub" onclick="mToast('All changes synced')" class="flex flex-col items-center gap-1.5 active:scale-90 transition-transform">
                <span class="w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl"><i class="ph-fill ph-cloud-check"></i></span>
                <span class="text-[11px] font-bold text-slate-600">Sync</span>
            </button>
        </div>
    </div>

    <!-- Chief only: needs review -->
    <div id="m-review-section" data-mroles="chief" class="px-4 mt-7">
        <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-extrabold text-slate-800 flex items-center gap-2"><i class="ph-fill ph-seal-check text-purple-500 text-lg"></i> Needs Your Review</h3>
        </div>
        <div id="m-review-list" class="flex flex-col gap-3"></div>
    </div>

    <!-- Jobs -->
    <div class="px-4 mt-7">
        <div class="flex items-center justify-between mb-3">
            <h3 id="m-jobs-title" class="text-sm font-extrabold text-slate-800">My Jobs</h3>
            <button onclick="mNav('repairs')" class="text-xs font-bold text-blue-600 active:opacity-60">See all</button>
        </div>
        <div id="m-jobs-list" class="flex flex-col gap-3"></div>
    </div>

    <!-- Chief only: team workload -->
    <div data-mroles="chief" class="px-4 mt-7">
        <h3 class="text-sm font-extrabold text-slate-800 mb-3">Team Workload</h3>
        <div id="m-team-list" class="bg-white rounded-2xl border border-slate-100 shadow-sm divide-y divide-slate-100"></div>
    </div>

    <!-- Alerts -->
    <div class="px-4 mt-7">
        <h3 class="text-sm font-extrabold text-slate-800 mb-3">Alerts</h3>
        <button onclick="mNav('inventory')" class="w-full text-left flex gap-3 p-3.5 bg-red-50 border border-red-100 rounded-2xl items-start active:scale-[0.98] transition-transform">
            <span class="w-9 h-9 rounded-xl bg-red-100 text-red-500 flex items-center justify-center text-lg shrink-0"><i class="ph-fill ph-warning-circle"></i></span>
            <div class="min-w-0 flex-1">
                <p class="text-sm font-bold text-red-800">Restock Warning</p>
                <p class="text-xs text-red-600 leading-relaxed mt-0.5">Yamaha V-Belt (NMAX) is out of stock. Front Disc Brake Pads are low (3 left).</p>
            </div>
            <i class="ph-bold ph-caret-right text-red-300 mt-2"></i>
        </button>
    </div>
</div>

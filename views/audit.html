<div id="view-audit" class="view-section active max-w-6xl mx-auto">
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col gap-4">
        <div class="flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4">
            <div class="relative w-full lg:max-w-md">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="audit-search" autocomplete="off" placeholder="Search by User Name, Action, or Record ID..." class="w-full pl-9 pr-4 py-2.5 rounded-lg border border-slate-300 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500/20 outline-none text-sm">
            </div>
            
            <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
                <select id="audit-filter-date" class="py-2.5 px-3 rounded-lg border border-slate-300 bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-blue-500/20 w-full sm:w-auto">
                    <option value="all">Date Range: All</option>
                    <option value="today">Today</option>
                    <option value="yesterday">Yesterday</option>
                </select>
                <select id="audit-filter-role" class="py-2.5 px-3 rounded-lg border border-slate-300 bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-blue-500/20 w-full sm:w-auto">
                    <option value="all">User Role: All</option>
                    <option value="owner">Shop Owner</option>
                    <option value="chief mechanic">Chief Mechanic</option>
                    <option value="cashier">Cashier</option>
                    <option value="automated">Automated (System)</option>
                </select>
                <select id="audit-filter-module" class="py-2.5 px-3 rounded-lg border border-slate-300 bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-blue-500/20 w-full sm:w-auto">
                    <option value="all">Module: All</option>
                    <option value="authentication">Authentication</option>
                    <option value="inventory">Inventory</option>
                    <option value="billing">Billing</option>
                    <option value="system maintenance">System Maintenance</option>
                </select>
                <button class="w-full sm:w-auto bg-slate-800 hover:bg-slate-900 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors shadow-sm flex items-center justify-center gap-2 whitespace-nowrap">
                    <i class="ph-bold ph-export"></i> Export CSV
                </button>
            </div>
        </div>
    </div>
    
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[1000px]">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase tracking-wider text-slate-500 font-bold">
                        <th class="p-4 w-8"></th>
                        <th class="p-4">Timestamp</th>
                        <th class="p-4">User & Role</th>
                        <th class="p-4">Module</th>
                        <th class="p-4 w-1/3">Action Performed</th>
                        <th class="p-4 text-center">Severity</th>
                    </tr>
                </thead>
                <!-- JS will inject dynamic rows here -->
                <tbody id="audit-tbody" class="divide-y divide-slate-100 text-sm">
                </tbody>
            </table>
        </div>
    </div>
</div>

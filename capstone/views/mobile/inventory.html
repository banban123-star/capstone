<div id="m-inventory" class="view-section pb-8 bg-slate-50 min-h-screen">
    <!-- Header & Search (Sticky) -->
    <div class="sticky top-0 z-20 bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 pt-5 pb-3">
        <h2 class="text-xl font-extrabold text-slate-800 mb-3 flex items-center gap-2">
            <i class="ph-fill ph-package text-orange-500"></i> Parts & Inventory
        </h2>
        <div class="relative">
            <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="m-inv-search" autocomplete="off" placeholder="Search parts, SKU..." class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-orange-500/20 outline-none text-sm font-medium shadow-sm transition-all">
        </div>
        
        <!-- Filters (Scrollable Chips) -->
        <div class="flex gap-2 overflow-x-auto mt-3 pb-1 snap-x scrollbar-hide" id="m-inv-filters">
            <button class="m-inv-filter active snap-start shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold bg-orange-600 text-white shadow-sm transition-colors" data-cat="">All Parts</button>
            <button class="m-inv-filter snap-start shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-600 border border-slate-200 shadow-sm transition-colors" data-cat="low">Low Stock</button>
            <button class="m-inv-filter snap-start shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-600 border border-slate-200 shadow-sm transition-colors" data-cat="engine">Engine</button>
            <button class="m-inv-filter snap-start shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-600 border border-slate-200 shadow-sm transition-colors" data-cat="electrical">Electrical</button>
            <button class="m-inv-filter snap-start shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-600 border border-slate-200 shadow-sm transition-colors" data-cat="brakes">Brakes</button>
        </div>
    </div>

    <!-- Inventory List -->
    <div class="p-4">
        <div class="flex items-center justify-between mb-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider" id="m-inv-count">0 Items</h3>
            <button onclick="openRestockModal()" class="text-xs font-bold text-orange-600 flex items-center gap-1 active:opacity-60 transition-opacity">
                <i class="ph-bold ph-arrows-clockwise"></i> Restock
            </button>
        </div>
        
        <div id="m-inventory-list" class="flex flex-col gap-3">
            <!-- Dynamic items go here -->
        </div>
    </div>

    <!-- FAB for adding new part -->
    <button onclick="openAddPartModal()" class="fixed right-4 bottom-20 z-30 w-14 h-14 bg-orange-600 text-white rounded-2xl shadow-lg shadow-orange-600/30 flex items-center justify-center text-2xl active:scale-90 transition-transform">
        <i class="ph-bold ph-plus"></i>
    </button>

    <!-- 1. Add New Part Profile Modal (Mobile Styled) -->
    <div id="modal-add-part" class="fixed inset-0 z-[70] hidden flex items-end sm:items-center justify-center p-0 sm:p-6">
        <div id="add-part-backdrop" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm opacity-0 transition-opacity duration-300" onclick="closeAddPartModal()"></div>
        <div id="add-part-content" class="relative bg-white rounded-t-3xl sm:rounded-xl shadow-2xl w-full flex flex-col transform translate-y-full sm:translate-y-0 sm:scale-95 opacity-0 transition-all duration-300 max-h-[85vh]">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mt-3 mb-1 sm:hidden"></div>
            <div class="flex items-center justify-between p-4 sm:p-5 border-b border-slate-200 shrink-0">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="ph-fill ph-plus-circle text-orange-600"></i> Add New Part
                </h2>
                <button onclick="closeAddPartModal()" class="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition-colors"><i class="ph ph-x text-xl"></i></button>
            </div>
            
            <div class="p-5 overflow-y-auto flex-1 flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">Part Name</label>
                    <input type="text" placeholder="e.g. Throttle Position Sensor" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-orange-500/20 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">SKU / Part Number</label>
                    <input type="text" placeholder="e.g. 16410-K59-A71" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-orange-500/20 outline-none text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">Price (₱)</label>
                        <input type="number" placeholder="0.00" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-orange-500/20 outline-none text-sm font-semibold text-orange-700">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">Initial Stock</label>
                        <input type="number" placeholder="Qty" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-orange-500/20 outline-none text-sm font-semibold">
                    </div>
                </div>
            </div>
            
            <div class="p-4 border-t border-slate-200 flex flex-col sm:flex-row justify-end gap-3 bg-slate-50 rounded-b-xl shrink-0">
                <button class="w-full sm:w-auto px-4 py-3 rounded-xl text-sm font-bold bg-orange-600 text-white hover:bg-orange-700 shadow-md flex items-center justify-center gap-2 transition-colors active:scale-[0.98]">
                    <i class="ph-bold ph-floppy-disk"></i> Save Part
                </button>
            </div>
        </div>
    </div>

    <!-- 2. Restock Modal (Mobile Styled) -->
    <div id="modal-restock" class="fixed inset-0 z-[70] hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div id="restock-backdrop" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm opacity-0 transition-opacity duration-300" onclick="closeRestockModal()"></div>
        <div id="restock-content" class="relative bg-white rounded-t-3xl sm:rounded-xl shadow-2xl w-full flex flex-col transform translate-y-full sm:translate-y-0 sm:scale-95 opacity-0 transition-all duration-300">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mt-3 mb-1 sm:hidden"></div>
            <div class="flex items-center justify-between p-4 sm:p-5 border-b border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="ph-fill ph-arrows-clockwise text-orange-600"></i> Quick Restock
                </h2>
                <button onclick="closeRestockModal()" class="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition-colors"><i class="ph ph-x text-xl"></i></button>
            </div>
            
            <div class="p-5 flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">Select Part</label>
                    <div class="relative">
                        <select class="w-full pl-3 pr-8 py-3 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-orange-500/20 outline-none text-sm appearance-none font-semibold">
                            <option value="" disabled selected>Search / Select part...</option>
                            <option>Front Disc Brake Pads</option>
                            <option>Yamaha V-Belt</option>
                            <option selected>Coolant Temp Sensor</option>
                        </select>
                        <i class="ph-bold ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4 p-4 bg-orange-50 border border-orange-100 rounded-xl">
                    <div>
                        <span class="block text-[10px] font-bold text-orange-600/70 uppercase mb-1">Current Stock</span>
                        <span class="text-base font-bold text-orange-800">24 Units</span>
                    </div>
                    <div>
                        <span class="block text-[10px] font-bold text-orange-600/70 uppercase mb-1">Quantity to Add</span>
                        <input type="number" placeholder="+0" class="w-full px-2 py-1 rounded bg-white border border-orange-200 focus:ring-2 focus:ring-orange-500/20 outline-none text-sm font-bold text-emerald-600">
                    </div>
                </div>
            </div>
            
            <div class="p-4 border-t border-slate-200 flex justify-end gap-3 bg-slate-50 rounded-b-xl">
                <button onclick="closeRestockModal()" class="w-full px-4 py-3 rounded-xl text-sm font-bold bg-orange-600 text-white hover:bg-orange-700 shadow-md transition-colors active:scale-[0.98]">Confirm Restock</button>
            </div>
        </div>
    </div>
</div>

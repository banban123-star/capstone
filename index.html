<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoCare - Shop Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 h-screen overflow-hidden flex">

    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden transition-opacity opacity-0 lg:hidden"></div>

    <aside id="sidebar" class="fixed lg:relative z-50 h-full bg-slate-900 text-slate-300 flex flex-col w-72 -translate-x-full lg:translate-x-0 shadow-2xl lg:shadow-none flex-shrink-0">
        <div class="h-16 flex items-center justify-between px-5 shrink-0 border-b border-slate-800 bg-slate-950">
            <div class="flex items-center text-blue-500 font-bold text-xl">
                <i class="ph-fill ph-motorcycle text-2xl mr-2"></i>
                <span class="text-white">MotoCare</span>
            </div>
            <button id="mobile-close-btn" class="lg:hidden p-2 rounded-lg hover:bg-slate-800 text-slate-400">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 flex flex-col gap-1 text-sm font-medium">
            <div class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mt-2 mb-2 px-3">Primary Navigation</div>

            <!-- Added data-roles attributes to control visibility -->
            <button class="nav-link active flex items-center w-full px-3 py-2.5 rounded-lg transition-colors bg-blue-600 text-white shadow-md shadow-blue-900/20" data-target="dashboard" data-roles="superadmin,owner,chief,sub">
                <i class="ph-fill ph-squares-four text-lg w-6"></i> Dashboard
            
            </button>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="customers" data-roles="superadmin,owner,chief">
                <i class="ph ph-users text-lg w-6"></i> Customers & Motorcycles
            </button>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="diagnostics" data-roles="superadmin,owner,chief,sub">
                <i class="ph ph-stethoscope text-lg w-6"></i> Diagnostics & Inspections
            </button>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="repairs" data-roles="superadmin,owner,chief,sub">
                <i class="ph ph-wrench text-lg w-6"></i> Active Repairs
            </button>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="inventory" data-roles="superadmin,owner,chief,sub">
                <i class="ph ph-package text-lg w-6"></i> Inventory
            </button>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="transactions" data-roles="superadmin,owner">
                <i class="ph ph-receipt text-lg w-6"></i> Transactions & Billing
            </button>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="history" data-roles="superadmin,owner,chief">
                <i class="ph ph-clock-counter-clockwise text-lg w-6"></i> Service History
            </button>

            <!-- Administration & Support -->
            <div id="nav-header-admin" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mt-6 mb-2 px-3">Administration & Support</div>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="reports" data-roles="superadmin,owner">
                <i class="ph ph-chart-line-up text-lg w-6"></i> Reports & Monitoring
            </button>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="audit" data-roles="superadmin,owner">
                <i class="ph ph-shield-check text-lg w-6"></i> Audit Logs
            </button>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="users" data-roles="superadmin,owner">
                <i class="ph ph-user-gear text-lg w-6"></i> User Management
            </button>

            <!-- System Settings -->
            <div id="nav-header-settings" class="px-3 py-2 mt-2 bg-slate-800/50 rounded-lg border border-slate-700/50">
                <div class="text-[10px] text-slate-500 uppercase font-bold mb-2">System Settings</div>
                <button class="nav-link flex items-center w-full py-1.5 text-slate-300 hover:text-white transition-colors" data-target="backup" data-roles="superadmin,owner">
                    <i class="ph ph-database text-base w-6"></i> Backup & Restore
                </button>
                <!-- Desktop to Mobile Toggle (Owner) -->
                <button class="flex items-center w-full py-1.5 mt-2 text-blue-400 hover:text-blue-300 transition-colors font-semibold" onclick="toggleOwnerMobileMode()" data-roles="owner">
                    <i class="ph ph-device-mobile text-base w-6"></i> Switch to Mobile UI
                </button>
            </div>
        </nav>

        <!-- Dynamic User Profile & Role Switcher -->
        <div class="p-4 bg-slate-950 border-t border-slate-800 shrink-0 flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div id="user-avatar" class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs shrink-0 shadow-inner">
                        IG
                    </div>
                    <div class="flex flex-col truncate">
                        <span id="user-name" class="text-sm font-bold text-slate-200 leading-none truncate">User</span>
                        <span id="user-role-text" class="text-[10px] text-slate-500 mt-1 truncate">Shop Owner</span>
                    </div>
                </div>
                <button class="text-slate-400 hover:text-red-400 p-2 rounded-lg hover:bg-red-500/10 transition-colors shrink-0" title="Log Out" onclick="handleLogout()">
                    <i class="ph ph-sign-out text-lg"></i>
                </button>
            </div>
            
            <!-- Development Role Switcher -->
            <div class="pt-3 border-t border-slate-800">
                <label class="text-[9px] uppercase font-bold text-slate-500 tracking-wider mb-1 block">Simulate Login As:</label>
                <select id="role-switcher" class="w-full bg-slate-900 border border-slate-700 text-slate-300 text-xs rounded-md px-2 py-1.5 outline-none focus:border-blue-500 transition-colors" onchange="switchRole(this.value)">
                    <option value="superadmin">Super Admin (System)</option>
                    <option value="owner">Shop Owner (User)</option>
                    <option value="chief">Chief Mechanic (Larpus)</option>
                    <option value="sub">Sub-Mechanic (Hiyo)</option>
                
                </select>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen min-w-0 bg-slate-100 relative">
        <header id="app-header" class="h-16 flex items-center px-4 sm:px-6 bg-white border-b border-slate-200 shrink-0 shadow-sm z-10">
            <button id="sidebar-toggle" class="p-2 -ml-2 mr-3 rounded-lg hover:bg-slate-100 text-slate-600 lg:hidden">
                <i class="ph ph-list text-2xl"></i>
            </button>
            <h1 id="header-title" class="text-lg font-bold text-slate-800">Dashboard / Home</h1>

            <!-- Mobile app bar actions (Chief / Sub-Mechanic only) -->
            <div id="m-header-actions" class="hidden ml-auto items-center gap-3">
                <span class="flex items-center gap-1.5 text-[10px] font-bold text-emerald-300">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Online
                </span>
                <button id="m-header-avatar" onclick="mToggleMore(true)" class="w-8 h-8 rounded-full text-white flex items-center justify-center font-bold text-xs shrink-0 ring-2 ring-white/20 active:scale-90 transition-transform"></button>
            </div>
        </header>

        <!-- Dynamic Content loads here -->
        <div id="main-content-area" class="flex-1 overflow-auto p-4 sm:p-6 relative">
            <!-- Fetch API will insert views here -->
        </div>

        <!-- Mobile bottom tab bar (Chief / Sub-Mechanic only) -->
        <nav id="mobile-bottom-nav" class="hidden shrink-0 bg-white border-t border-slate-200 grid-cols-5 items-end px-1 relative z-20">
            <button class="m-tab" data-mtab="dashboard" onclick="mNav('dashboard')">
                <i class="ph-fill ph-house text-2xl"></i><span>Home</span>
            </button>
            <button class="m-tab" data-mtab="repairs" onclick="mNav('repairs')">
                <span class="relative"><i class="ph-fill ph-wrench text-2xl"></i><span id="m-jobs-badge" class="absolute -top-1 -right-2.5 min-w-[16px] h-4 px-1 rounded-full bg-red-500 text-white text-[9px] font-bold flex items-center justify-center">0</span></span>
                <span>Jobs</span>
            </button>
            <button class="m-tab m-tab-fab" data-mtab="diagnostics" onclick="mNav('diagnostics')">
                <span class="m-fab"><i class="ph-fill ph-cpu text-2xl"></i></span>
                <span>Scan</span>
            </button>
            <button class="m-tab" data-mtab="inventory" onclick="mNav('inventory')">
                <i class="ph-fill ph-package text-2xl"></i><span>Parts</span>
            </button>
            <button class="m-tab" data-mtab="more" onclick="mToggleMore(true)">
                <i class="ph-bold ph-dots-three-outline text-2xl"></i><span>More</span>
            </button>
        </nav>

        <!-- "More" bottom sheet -->
        <div id="m-more-backdrop" class="absolute inset-0 bg-slate-900/50 z-30" onclick="mToggleMore(false)"></div>
        <div id="m-more-sheet" class="absolute left-0 right-0 bottom-0 z-40 bg-white rounded-t-3xl px-5 pt-3 pb-6 shadow-2xl">
            <div class="w-10 h-1 rounded-full bg-slate-300 mx-auto mb-4"></div>

            <div class="flex items-center gap-3 mb-4">
                <div id="m-sheet-avatar" class="w-12 h-12 rounded-full text-white flex items-center justify-center font-bold text-base shrink-0"></div>
                <div class="min-w-0">
                    <p id="m-sheet-name" class="text-base font-extrabold text-slate-800 leading-tight truncate"></p>
                    <p id="m-sheet-role" class="text-xs font-semibold text-slate-500"></p>
                </div>
            </div>

            <div class="flex flex-col gap-1">
                <button data-mroles="chief" onclick="mNav('customers')" class="m-sheet-row">
                    <span class="m-sheet-icon bg-blue-100 text-blue-600"><i class="ph-fill ph-users"></i></span> Customers &amp; Motorcycles
                    <i class="ph-bold ph-caret-right ml-auto text-slate-300"></i>
                </button>
                <button data-mroles="chief" onclick="mNav('history')" class="m-sheet-row">
                    <span class="m-sheet-icon bg-emerald-100 text-emerald-600"><i class="ph-fill ph-clock-counter-clockwise"></i></span> Service History
                    <i class="ph-bold ph-caret-right ml-auto text-slate-300"></i>
                </button>
                <!-- Mobile to Desktop Toggle (Owner) -->
            <button data-mroles="owner" onclick="toggleOwnerMobileMode()" class="m-sheet-row mt-1">
                <span class="m-sheet-icon bg-blue-100 text-blue-600"><i class="ph-fill ph-desktop"></i></span> Switch to Desktop UI
                <i class="ph-bold ph-caret-right ml-auto text-slate-300"></i>
            </button>

            <!-- Development role switcher -->
            <div class="mt-4 pt-4 border-t border-slate-100">
                <label class="text-[9px] uppercase font-bold text-slate-400 tracking-wider mb-1 block">Simulate Login As:</label>
                <select id="m-role-switcher" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-3 py-2.5 outline-none focus:border-blue-500" onchange="switchRole(this.value)">
                    <option value="superadmin">Super Admin (System)</option>
                    <option value="owner">Shop Owner (User)</option>
                    <option value="chief">Chief Mechanic (Larpus)</option>
                    <option value="sub">Sub-Mechanic (Hiyo)</option>
                
                </select>
            </div>

            <button onclick="mToggleMore(false); handleLogout()" class="w-full mt-4 py-3 rounded-xl bg-red-50 text-red-600 font-bold text-sm flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
                <i class="ph-bold ph-sign-out text-lg"></i> Sign Out
            </button>
        </div>

        <!-- Toast -->
        <div id="m-toast" class="absolute left-1/2 -translate-x-1/2 bottom-24 z-50 bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg"></div>
    </main>


    <!-- Login Screen Overlay -->
    <div id="login-screen" class="fixed inset-0 z-[100] hidden bg-slate-900/95 flex-col items-center justify-center p-4 backdrop-blur-md">
        
        <!-- Profile Selection View -->
        <div id="login-profile-view" class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 sm:p-8 flex flex-col gap-6 text-center transform transition-all relative">
            
            <!-- NEW: Close Button -->
            <button onclick="closeLoginScreen()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 p-2 rounded-lg transition-colors bg-slate-50 hover:bg-slate-100">
                <i class="ph-bold ph-x text-xl"></i>
            </button>

            <div class="flex items-center justify-center text-blue-600 font-bold text-3xl mb-2">
                <i class="ph-fill ph-motorcycle mr-2 text-4xl"></i> MotoCare
            </div>
            <div>
                <h2 class="text-xl font-bold text-slate-800">Welcome Back</h2>
                <p class="text-sm text-slate-500 mt-1">Select your profile to sign in.</p>
            </div>
            
            <!-- 2x2 Scalable Grid Layout -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-2">
                <!-- Super Admin -->
            <button onclick="promptPin('superadmin', 'System Admin', 'SA', 'bg-slate-800')" class="w-full p-4 bg-slate-50 hover:bg-slate-200 border border-slate-200 hover:border-slate-400 rounded-xl text-left flex items-center gap-4 transition-all group sm:col-span-2 md:col-span-1">
                <div class="w-12 h-12 rounded-full bg-slate-800 text-white flex items-center justify-center font-bold text-base shrink-0 shadow-inner">SA</div>
                <div>
                    <div class="text-base font-bold text-slate-800 group-hover:text-slate-900">System Admin</div>
                    <div class="text-[10px] text-slate-500 uppercase tracking-wider font-bold mt-0.5">Super Admin</div>
                </div>
            </button>
                <!-- Shop Owner -->
                <button onclick="promptPin('owner', 'Ivan', 'IG', 'bg-blue-600')" class="w-full p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 rounded-xl text-left flex items-center gap-4 transition-all group">
                    <div class="w-12 h-12 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-base shrink-0 shadow-inner">IG</div>
                    <div>
                        <div class="text-base font-bold text-slate-800 group-hover:text-blue-700">Ivan</div>
                        <div class="text-[10px] text-slate-500 uppercase tracking-wider font-bold mt-0.5">Shop Owner</div>
                    </div>
                </button>
                <!-- Chief Mechanic -->
                <button onclick="promptPin('chief', 'Larpus', 'JB', 'bg-purple-600')" class="w-full p-4 bg-slate-50 hover:bg-purple-50 border border-slate-200 hover:border-purple-300 rounded-xl text-left flex items-center gap-4 transition-all group">
                    <div class="w-12 h-12 rounded-full bg-purple-600 text-white flex items-center justify-center font-bold text-base shrink-0 shadow-inner">JB</div>
                    <div>
                        <div class="text-base font-bold text-slate-800 group-hover:text-purple-700">Larpus</div>
                        <div class="text-[10px] text-slate-500 uppercase tracking-wider font-bold mt-0.5">Chief Mechanic</div>
                    </div>
                </button>
                <!-- Sub-Mechanic -->
                <button onclick="promptPin('sub', 'Hiyo', 'F', 'bg-slate-600')" class="w-full p-4 bg-slate-50 hover:bg-slate-100 border border-slate-200 hover:border-slate-400 rounded-xl text-left flex items-center gap-4 transition-all group">
                    <div class="w-12 h-12 rounded-full bg-slate-600 text-white flex items-center justify-center font-bold text-base shrink-0 shadow-inner">F</div>
                    <div>
                        <div class="text-base font-bold text-slate-800 group-hover:text-slate-700">Hiyo</div>
                        <div class="text-[10px] text-slate-500 uppercase tracking-wider font-bold mt-0.5">Sub-Mechanic</div>
                    </div>
                </button>
            
            
            
            <!-- System Status Footer -->
            <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400 font-medium">
                <span>MotoCare OS v1.2.4</span>
                <span class="flex items-center gap-1.5 text-emerald-600 font-bold bg-emerald-50 px-2 py-1 rounded-md border border-emerald-100"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Database Online</span>
            </div>
        </div>

        <!-- PIN Pad View (Hidden by default) -->
        <div id="login-pin-view" class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-8 flex flex-col gap-6 text-center transform transition-all hidden relative">
            <button onclick="backToProfiles()" class="absolute top-4 left-4 text-slate-400 hover:text-slate-700 p-2 rounded-lg transition-colors bg-slate-50 hover:bg-slate-100"><i class="ph-bold ph-arrow-left text-xl"></i></button>
            
            <div class="flex flex-col items-center gap-2 mt-4">
                <div id="pin-avatar" class="w-16 h-16 rounded-full text-white flex items-center justify-center font-bold text-2xl shadow-inner"></div>
                <div>
                    <h2 id="pin-name" class="text-xl font-bold text-slate-800">Name</h2>
                    <p class="text-sm text-slate-500 mt-0.5">Enter your 4-digit PIN</p>
                </div>
            </div>

            <!-- PIN Display -->
            <div class="flex justify-center gap-4 my-2">
                <div class="w-4 h-4 rounded-full border-2 border-slate-300 pin-dot transition-colors"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-300 pin-dot transition-colors"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-300 pin-dot transition-colors"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-300 pin-dot transition-colors"></div>
            </div>

            <!-- Numpad -->
            <div class="grid grid-cols-3 gap-3">
                <button onclick="addPin('1')" class="p-4 text-xl font-bold text-slate-700 bg-slate-50 rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-colors">1</button>
                <button onclick="addPin('2')" class="p-4 text-xl font-bold text-slate-700 bg-slate-50 rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-colors">2</button>
                <button onclick="addPin('3')" class="p-4 text-xl font-bold text-slate-700 bg-slate-50 rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-colors">3</button>
                <button onclick="addPin('4')" class="p-4 text-xl font-bold text-slate-700 bg-slate-50 rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-colors">4</button>
                <button onclick="addPin('5')" class="p-4 text-xl font-bold text-slate-700 bg-slate-50 rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-colors">5</button>
                <button onclick="addPin('6')" class="p-4 text-xl font-bold text-slate-700 bg-slate-50 rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-colors">6</button>
                <button onclick="addPin('7')" class="p-4 text-xl font-bold text-slate-700 bg-slate-50 rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-colors">7</button>
                <button onclick="addPin('8')" class="p-4 text-xl font-bold text-slate-700 bg-slate-50 rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-colors">8</button>
                <button onclick="addPin('9')" class="p-4 text-xl font-bold text-slate-700 bg-slate-50 rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-colors">9</button>
                <button onclick="clearPin()" class="p-4 text-xl font-bold text-slate-400 bg-transparent rounded-xl hover:text-red-500 transition-colors"><i class="ph-bold ph-x"></i></button>
                <button onclick="addPin('0')" class="p-4 text-xl font-bold text-slate-700 bg-slate-50 rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-colors">0</button>
                <button onclick="removePin()" class="p-4 text-xl font-bold text-slate-400 bg-transparent rounded-xl hover:text-slate-700 transition-colors"><i class="ph-bold ph-backspace"></i></button>
            </div>

            <button id="btn-login-submit" onclick="submitLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-md shadow-blue-500/30 flex items-center justify-center gap-2 opacity-50 cursor-not-allowed" disabled>
                Sign In
            </button>
            
            <button onclick="alert('Admin Override Triggered. Please enter Master PIN or check email for recovery link.')" class="text-[10px] font-bold text-slate-400 hover:text-blue-600 uppercase tracking-wider mt-1 transition-colors underline underline-offset-2">Forgot PIN? / Admin Override</button>
        </div>
    </div>


<template id="view-audit">
<div id="view-audit" class="view-section active max-w-6xl mx-auto">
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col gap-4">
        <div class="flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4">
            <div class="relative w-full lg:max-w-md">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="audit-search" autocomplete="off" placeholder="Search by User Name, Action, or Record ID..." class="w-full pl-9 pr-4 py-2.5 rounded-lg border border-slate-300 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500/20 outline-none text-sm">
            </div>
            
            <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
                <select id="audit-filter-date" class="py-2.5 px-3 rounded-lg border border-slate-300 bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-blue-500/20 w-full sm:w-auto">
                    <option value="all">Date Range: All</option>
                    <option value="today">Today</option>
                    <option value="yesterday">Yesterday</option>
                </select>
                <select id="audit-filter-role" class="py-2.5 px-3 rounded-lg border border-slate-300 bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-blue-500/20 w-full sm:w-auto">
                    <option value="all">User Role: All</option>
                    <option value="owner">Shop Owner</option>
                    <option value="chief mechanic">Chief Mechanic</option>
                  
                    <option value="automated">Automated (System)</option>
                </select>
                <select id="audit-filter-module" class="py-2.5 px-3 rounded-lg border border-slate-300 bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-blue-500/20 w-full sm:w-auto">
                    <option value="all">Module: All</option>
                    <option value="authentication">Authentication</option>
                    <option value="inventory">Inventory</option>
                    <option value="billing">Billing</option>

                    <h3 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-3 border-b border-slate-200 pb-2">3. Authentication Details</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">System Username</label>
                            <div class="relative">
                                <i class="ph ph-at absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="text" placeholder="username" class="w-full pl-9 pr-3 py-2 rounded-lg border border-slate-300 bg-white focus:ring-2 focus:ring-blue-500/20 outline-none text-sm font-mono">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">Temporary Password</label>
                            <input type="password" placeholder="••••••••" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white focus:ring-2 focus:ring-blue-500/20 outline-none text-sm font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">Confirm Password</label>
                            <input type="password" placeholder="••••••••" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white focus:ring-2 focus:ring-blue-500/20 outline-none text-sm font-mono">
                        </div>
                        <div class="sm:col-span-2 mt-1">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" checked class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                                <span class="text-xs font-semibold text-slate-700">Require user to change password on first login</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="p-4 sm:p-5 border-t border-slate-200 bg-slate-50 shrink-0 flex gap-3 rounded-b-xl justify-end">
                <button onclick="closeUserModal()" class="px-5 py-2.5 rounded-lg text-sm font-semibold text-slate-600 border border-slate-300 hover:bg-slate-200 transition-colors">Cancel</button>
                <button class="px-5 py-2.5 rounded-lg text-sm font-bold bg-blue-600 text-white hover:bg-blue-700 shadow-md shadow-blue-900/20 flex items-center justify-center gap-2 transition-colors">
                    <i class="ph-bold ph-floppy-disk"></i> Save Account Details
                </button>
            </div>
        </div>
    </div>
</div>
</template>

<template id="view-mobile-dashboard">
<div id="m-home" class="view-section pb-8">

    <!-- Hero -->
    <div id="m-hero" class="relative px-5 pt-5 pb-16 text-white rounded-b-[2rem] bg-gradient-to-br from-purple-600 to-indigo-700 overflow-hidden">
        <i class="ph-fill ph-motorcycle absolute -right-4 -bottom-4 text-[7rem] text-white/10 rotate-[-8deg] pointer-events-none"></i>
        <div class="flex items-start justify-between relative">
            <div class="min-w-0">
                <p id="m-greeting" class="text-xs font-semibold text-white/70">Good day,</p>
                <h2 id="m-name" class="text-2xl font-extrabold leading-tight truncate">Mechanic</h2>
                <p id="m-date" class="text-xs font-medium text-white/70 mt-1"></p>
            </div>
            <button onclick="mToast('No new notifications')" class="relative w-10 h-10 rounded-full bg-white/15 flex items-center justify-center active:scale-90 transition-transform shrink-0">
                <i class="ph-bold ph-bell text-lg"></i>
                <span class="absolute top-2.5 right-2.5 w-2 h-2 bg-red-400 rounded-full ring-2 ring-white/20"></span>
            </button>
        </div>
        <div class="flex items-center gap-2 mt-4 relative">
            <span class="inline-flex items-center gap-1.5 bg-white/15 px-2.5 py-1 rounded-full text-[11px] font-bold">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-300 animate-pulse"></span> Synced
            </span>
            <span id="m-role-chip" class="inline-flex items-center gap-1.5 bg-white/15 px-2.5 py-1 rounded-full text-[11px] font-bold"></span>
        </div>
    </div>

    <!-- Floating stat card -->
    <div class="mx-4 -mt-10 bg-white rounded-2xl shadow-lg shadow-slate-900/10 border border-slate-100 grid grid-cols-3 divide-x divide-slate-100 relative">
        <div class="py-4 text-center">
            <p id="m-stat-active" class="text-2xl font-extrabold text-slate-800 leading-none">0</p>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mt-1.5">Active Jobs</p>
        </div>
        <div class="py-4 text-center">
            <p id="m-stat-waiting" class="text-2xl font-extrabold text-orange-500 leading-none">0</p>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mt-1.5">Waiting Parts</p>
        </div>
        <div class="py-4 text-center">
            <p id="m-stat-done" class="text-2xl font-extrabold text-emerald-500 leading-none">3</p>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mt-1.5">Done Today</p>
        </div>
    </div>

    <!-- Quick actions -->
    <div class="px-4 mt-6">
        <div class="grid grid-cols-4 gap-3">
            <button onclick="mNav('diagnostics')" class="flex flex-col items-center gap-1.5 active:scale-90 transition-transform">
                <span class="w-14 h-14 rounded-2xl bg-purple-100 text-purple-600 flex items-center justify-center text-2xl"><i class="ph-fill ph-cpu"></i></span>
                <span class="text-[11px] font-bold text-slate-600">Scan</span>
            </button>
            <button onclick="mNav('repairs')" class="flex flex-col items-center gap-1.5 active:scale-90 transition-transform">
                <span class="w-14 h-14 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center text-2xl"><i class="ph-fill ph-wrench"></i></span>
                <span class="text-[11px] font-bold text-slate-600">Jobs</span>
            </button>
            <button onclick="mNav('inventory')" class="flex flex-col items-center gap-1.5 active:scale-90 transition-transform">
                <span class="w-14 h-14 rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center text-2xl"><i class="ph-fill ph-package"></i></span>
                <span class="text-[11px] font-bold text-slate-600">Parts</span>
            </button>
            <button data-mroles="chief" onclick="mNav('history')" class="flex flex-col items-center gap-1.5 active:scale-90 transition-transform">
                <span class="w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl"><i class="ph-fill ph-clock-counter-clockwise"></i></span>
                <span class="text-[11px] font-bold text-slate-600">History</span>
            </button>
            <button data-mroles="sub" onclick="mToast('All changes synced')" class="flex flex-col items-center gap-1.5 active:scale-90 transition-transform">
                <span class="w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl"><i class="ph-fill ph-cloud-check"></i></span>
                <span class="text-[11px] font-bold text-slate-600">Sync</span>
            </button>
        </div>
    </div>

    <!-- Chief only: needs review -->
    <div id="m-review-section" data-mroles="chief" class="px-4 mt-7">
        <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-extrabold text-slate-800 flex items-center gap-2"><i class="ph-fill ph-seal-check text-purple-500 text-lg"></i> Needs Your Review</h3>
        </div>
        <div id="m-review-list" class="flex flex-col gap-3"></div>
    </div>

    <!-- Jobs -->
    <div class="px-4 mt-7">
        <div class="flex items-center justify-between mb-3">
            <h3 id="m-jobs-title" class="text-sm font-extrabold text-slate-800">My Jobs</h3>
            <button onclick="mNav('repairs')" class="text-xs font-bold text-blue-600 active:opacity-60">See all</button>
        </div>
        <div id="m-jobs-list" class="flex flex-col gap-3"></div>
    </div>

    <!-- Chief only: team workload -->
    <div data-mroles="chief" class="px-4 mt-7">
        <h3 class="text-sm font-extrabold text-slate-800 mb-3">Team Workload</h3>
        <div id="m-team-list" class="bg-white rounded-2xl border border-slate-100 shadow-sm divide-y divide-slate-100"></div>
    </div>

    <!-- Alerts -->
    <div class="px-4 mt-7">
        <h3 class="text-sm font-extrabold text-slate-800 mb-3">Alerts</h3>
        <button onclick="mNav('inventory')" class="w-full text-left flex gap-3 p-3.5 bg-red-50 border border-red-100 rounded-2xl items-start active:scale-[0.98] transition-transform">
            <span class="w-9 h-9 rounded-xl bg-red-100 text-red-500 flex items-center justify-center text-lg shrink-0"><i class="ph-fill ph-warning-circle"></i></span>
            <div class="min-w-0 flex-1">
                <p class="text-sm font-bold text-red-800">Restock Warning</p>
                <p class="text-xs text-red-600 leading-relaxed mt-0.5">Yamaha V-Belt (NMAX) is out of stock. Front Disc Brake Pads are low (3 left).</p>
            </div>
            <i class="ph-bold ph-caret-right text-red-300 mt-2"></i>
        </button>
    </div>
</div>

</template>


    <script src="script.js"></script>
</body>
</html>

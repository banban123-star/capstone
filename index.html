<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoCare - Shop Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 h-screen overflow-hidden flex">

    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden transition-opacity opacity-0 lg:hidden"></div>

    <aside id="sidebar" class="fixed lg:relative z-50 h-full bg-slate-900 text-slate-300 flex flex-col w-72 -translate-x-full lg:translate-x-0 shadow-2xl lg:shadow-none flex-shrink-0">
        <div class="h-16 flex items-center justify-between px-5 shrink-0 border-b border-slate-800 bg-slate-950">
            <div class="flex items-center text-blue-500 font-bold text-xl">
                <i class="ph-fill ph-motorcycle text-2xl mr-2"></i>
                <span class="text-white">MotoCare</span>
            </div>
            <button id="mobile-close-btn" class="lg:hidden p-2 rounded-lg hover:bg-slate-800 text-slate-400">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 flex flex-col gap-1 text-sm font-medium">
            <div class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mt-2 mb-2 px-3">Primary Navigation</div>

            <!-- Added data-roles attributes to control visibility -->
            <button class="nav-link active flex items-center w-full px-3 py-2.5 rounded-lg transition-colors bg-blue-600 text-white shadow-md shadow-blue-900/20" data-target="dashboard" data-roles="owner,chief,sub,cashier">
                <i class="ph-fill ph-squares-four text-lg w-6"></i> Dashboard / Home
            </button>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="customers" data-roles="owner,chief,cashier">
                <i class="ph ph-users text-lg w-6"></i> Customers & Motorcycles
            </button>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="diagnostics" data-roles="owner,chief,sub">
                <i class="ph ph-stethoscope text-lg w-6"></i> Diagnostics & Inspections
            </button>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="repairs" data-roles="owner,chief,sub">
                <i class="ph ph-wrench text-lg w-6"></i> Active Repairs
            </button>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="inventory" data-roles="owner,chief,sub,cashier">
                <i class="ph ph-package text-lg w-6"></i> Inventory
            </button>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="transactions" data-roles="owner,cashier">
                <i class="ph ph-receipt text-lg w-6"></i> Transactions & Billing
            </button>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="history" data-roles="owner,chief">
                <i class="ph ph-clock-counter-clockwise text-lg w-6"></i> Service History
            </button>

            <!-- Administration & Support -->
            <div id="nav-header-admin" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mt-6 mb-2 px-3">Administration & Support</div>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="reports" data-roles="owner">
                <i class="ph ph-chart-line-up text-lg w-6"></i> Reports & Monitoring
            </button>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="audit" data-roles="owner">
                <i class="ph ph-shield-check text-lg w-6"></i> Audit Logs
            </button>
            <button class="nav-link flex items-center w-full px-3 py-2.5 rounded-lg transition-colors hover:bg-slate-800 hover:text-white" data-target="users" data-roles="owner">
                <i class="ph ph-user-gear text-lg w-6"></i> User Management
            </button>

            <!-- System Settings -->
            <div id="nav-header-settings" class="px-3 py-2 mt-2 bg-slate-800/50 rounded-lg border border-slate-700/50">
                <div class="text-[10px] text-slate-500 uppercase font-bold mb-2">System Settings</div>
                <button class="nav-link flex items-center w-full py-1.5 text-slate-300 hover:text-white transition-colors" data-target="backup" data-roles="owner">
                    <i class="ph ph-database text-base w-6"></i> Backup & Restore
                </button>
                <div class="flex items-center justify-between w-full py-1.5 text-slate-300">
                    <div class="flex items-center"><i class="ph ph-cloud-check text-base w-6"></i> Offline Sync</div>
                    <div class="w-2 h-2 bg-emerald-500 rounded-full shadow-[0_0_5px_rgba(16,185,129,0.5)]"></div>
                </div>
            </div>
        </nav>

        <!-- Dynamic User Profile & Role Switcher -->
        <div class="p-4 bg-slate-950 border-t border-slate-800 shrink-0 flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div id="user-avatar" class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs shrink-0 shadow-inner">
                        IG
                    </div>
                    <div class="flex flex-col truncate">
                        <span id="user-name" class="text-sm font-bold text-slate-200 leading-none truncate">User</span>
                        <span id="user-role-text" class="text-[10px] text-slate-500 mt-1 truncate">Shop Owner</span>
                    </div>
                </div>
                <button class="text-slate-400 hover:text-red-400 p-2 rounded-lg hover:bg-red-500/10 transition-colors shrink-0" title="Log Out" onclick="alert('Logged out. Please use the dropdown to simulate logging back in.')">
                    <i class="ph ph-sign-out text-lg"></i>
                </button>
            </div>
            
            <!-- Development Role Switcher -->
            <div class="pt-3 border-t border-slate-800">
                <label class="text-[9px] uppercase font-bold text-slate-500 tracking-wider mb-1 block">Simulate Login As:</label>
                <select id="role-switcher" class="w-full bg-slate-900 border border-slate-700 text-slate-300 text-xs rounded-md px-2 py-1.5 outline-none focus:border-blue-500 transition-colors" onchange="switchRole(this.value)">
                    <option value="owner">Shop Owner (User)</option>
                    <option value="chief">Chief Mechanic (Larpus)</option>
                    <option value="sub">Sub-Mechanic (Hiyo)</option>
                    <option value="cashier">Cashier (Sarah)</option>
                </select>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen min-w-0 bg-slate-100">
        <header class="h-16 flex items-center px-4 sm:px-6 bg-white border-b border-slate-200 shrink-0 shadow-sm z-10">
            <button id="sidebar-toggle" class="p-2 -ml-2 mr-3 rounded-lg hover:bg-slate-100 text-slate-600 lg:hidden">
                <i class="ph ph-list text-2xl"></i>
            </button>
            <h1 id="header-title" class="text-lg font-bold text-slate-800">Dashboard / Home</h1>
        </header>

        <!-- Dynamic Content loads here -->
        <div id="main-content-area" class="flex-1 overflow-auto p-4 sm:p-6 relative">
            <!-- Fetch API will insert views here -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
